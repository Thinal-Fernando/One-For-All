name: Release

# Push a tag like v0.2.0 to build, sign and publish a release. Installed copies
# of OFA find it through latest.json and offer the update.
#
# Needs the repository secret TAURI_SIGNING_PRIVATE_KEY: the contents of the
# key file made with `npx tauri signer generate` (its public half is in
# tauri.conf.json). The version in tauri.conf.json must match the tag.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: OFA ${{ github.ref_name }}
          releaseBody: See the commits since the last release.
          releaseDraft: false
          includeUpdaterJson: true
          # Updater files are only made for releases, so local builds don't
          # need the signing key.
          args: --config src-tauri/tauri.release.conf.json
